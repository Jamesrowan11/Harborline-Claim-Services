# Additional nginx directives for Plesk (Websites & Domains -> Apache & nginx Settings)
# Document root must already point at .../httpdocs/public

# Deny access to hidden files and sensitive paths (defense in depth;
# these are outside the docroot anyway)
location ~ /\.(?!well-known) { deny all; }

# Static asset caching
location ~* \.(css|js|woff2?|svg|png|jpe?g|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Front controller
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

client_max_body_size 26m;

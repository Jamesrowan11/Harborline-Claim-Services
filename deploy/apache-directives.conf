# Additional Apache directives when Apache runs behind nginx in Plesk.
# public/.htaccess already handles rewrites; these are belt-and-braces.
<Directory "/var/www/vhosts/example.com/httpdocs/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Never serve the application root directly
<Directory "/var/www/vhosts/example.com/httpdocs">
    <Files ".env">
        Require all denied
    </Files>
</Directory>
